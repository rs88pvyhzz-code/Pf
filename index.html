<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --ink:#161D2B; --muted:#6A7282; --faint:#9AA1AE; --line:#E4E1DA; --soft:#F7F6F2;
  --gain:#1F6B47; --loss:#A03340; --gain-bg:#E6F1EA; --loss-bg:#F6E7E8;
  --a1:#22375A; --a2:#6E8FBF; --a3:#B4935C; --a4:#A9AFBB;
  --stuart:#22375A; --reeta:#B4935C; --bar:#22375A;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E131D; --surface:#161D2B; --ink:#ECEFF4; --muted:#9BA4B4; --faint:#6C7586; --line:#263043; --soft:#1B2333;
    --gain:#62C493; --loss:#E8808A; --gain-bg:#173426; --loss-bg:#3A1E24;
    --a1:#9DB8E0; --a2:#557DB4; --a3:#D2AE72; --a4:#6C7586; --stuart:#9DB8E0; --reeta:#D2AE72; --bar:#9DB8E0; color-scheme:dark;}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 "IBM Plex Sans",system-ui,-apple-system,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.app{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;height:100dvh;
  padding:max(16px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
.side{display:flex;flex-direction:column;gap:11px;min-height:0;overflow:auto;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.eyebrow{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);letter-spacing:.02em}
.eyebrow b{font-weight:600;color:var(--ink);letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.total{font:500 48px/1 "Newsreader",Georgia,serif;letter-spacing:-.02em;margin:8px 0 10px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 11px;width:100%}
.chip span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chip b{display:block;font-weight:600;font-size:14.5px;margin-top:1px;white-space:nowrap}
.chip i{font-style:normal;font-size:11.5px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.since{font-size:12px;color:var(--muted);margin-top:7px}
.since b{font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.card h2{margin:0 0 7px;font:600 11px/1 "IBM Plex Sans",sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;display:flex;justify-content:space-between}
.card h2 em{font-style:normal;font-weight:500;text-transform:none;letter-spacing:0;color:var(--faint)}
.mrow{display:grid;grid-template-columns:10px 1fr auto 42px;align-items:center;gap:0 8px;padding:4px 4px;font-size:13px;width:100%;text-align:left;border-radius:6px}
.mrow + .mrow{border-top:1px solid var(--line)}
.mrow .dot{width:8px;height:8px;border-radius:2px}
.mrow .v{font-weight:500}
.mrow .p{color:var(--muted);text-align:right;font-size:12px}
.mrow[aria-pressed="true"]{background:var(--soft)}
.mrow[aria-pressed="true"] .l{font-weight:600}
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin:2px 0 8px}
.stack span{height:100%}
.reg{display:grid;grid-template-columns:104px 1fr 38px;align-items:center;gap:8px;font-size:12.5px;padding:1.5px 0}
.reg .track{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.reg .track span{display:block;height:100%;background:var(--a2);border-radius:3px}
.reg .p{text-align:right;color:var(--muted);font-size:12px}
.tools{display:flex;gap:4px;align-items:center;margin-top:auto;padding-top:2px;font-size:12px;color:var(--faint)}
.tools button{color:var(--muted);padding:4px 8px;border-radius:6px}
.tools .sp{flex:1}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{display:flex;align-items:center;gap:14px;padding:10px 16px 9px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:18px;align-items:baseline}
.tabs button{font:500 22px/1 "Newsreader",Georgia,serif;color:var(--faint);padding:4px 0;border-bottom:2px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.ph .sum{color:var(--muted);font-size:12.5px}
.ph .sp{flex:1}
.filter{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 10px;white-space:nowrap}
.filter button{width:18px;height:18px;border-radius:50%;color:var(--muted);line-height:18px;text-align:center}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{color:var(--muted);padding:4px 12px;border-radius:8px;text-align:center;min-width:72px}
.seg button b{display:block;font-size:13px;font-weight:500;line-height:1.2}
.seg button small{display:block;font-size:11.5px;line-height:1.2;color:var(--faint)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button[aria-pressed="true"] small{color:var(--muted)}
.cols,.hr{display:grid;grid-template-columns:22px minmax(0,1fr) 46px 108px 92px 82px 64px;align-items:center;gap:0 12px;padding:0 16px}
.cols{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);height:28px;border-bottom:1px solid var(--line)}
.cols .r,.hr .r{text-align:right}
.cols button{text-transform:inherit;letter-spacing:inherit;font-weight:inherit;color:inherit}
.cols button[aria-pressed="true"]{color:var(--ink)}
.body{flex:1;min-height:0;overflow:auto}
.hr{height:var(--rh,28px);font-size:13px;border-bottom:1px solid var(--line)}
.hr:last-child{border-bottom:0}
.hr:nth-child(even){background:var(--soft)}
.own{width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:600;display:grid;place-items:center;color:#fff}
.own.Stuart{background:var(--stuart)} .own.Reeta{background:var(--reeta)}
@media (prefers-color-scheme:dark){.own{color:#0E131D}}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.nm small{color:var(--faint);font-weight:400;margin-left:6px;font-size:11.5px}
.tag{white-space:nowrap;font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 5px;justify-self:start}
.hr:nth-child(even) .tag{background:var(--surface)}
.w{display:flex;align-items:center;gap:6px}
.w .t{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.w .t span{display:block;height:100%;background:var(--bar);opacity:.75}
.w em{font-style:normal;font-size:11.5px;color:var(--muted);width:36px;text-align:right}
.val{font-weight:600}
.up{color:var(--gain)} .down{color:var(--loss)} .flat{color:var(--faint)}
.pill{font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 5px;justify-self:end}
.pill.up{background:var(--gain-bg)} .pill.down{background:var(--loss-bg)} .pill.flat{background:var(--soft)}
.note{font-size:12px;color:var(--muted);padding:6px 16px;border-top:1px solid var(--line)}
.note:empty{display:none}
.note.err{color:var(--loss)}

/* by-account page */
.wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px 14px;align-items:start}
.wcol{display:flex;flex-direction:column;gap:12px}
.wb{border:1px solid var(--line);border-radius:12px;padding:10px 12px 6px}
.wb header{display:flex;justify-content:space-between;align-items:baseline}
.wb h3{margin:0;font:500 18px/1.1 "Newsreader",Georgia,serif}
.wb header b{font-weight:600;font-size:15px}
.split{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);margin:7px 0 5px}
.split span{height:100%}
.wsum{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.wsum i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.wsum b{color:var(--ink);font-weight:600}
.wr{display:grid;grid-template-columns:minmax(0,1fr) 56px 56px 62px 38px;gap:0 8px;align-items:center;font-size:12.5px;height:22px;border-top:1px solid var(--line)}
.wr span:not(:first-child){text-align:right}
.wr .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr .n small{color:var(--faint);margin-left:5px;font-size:11px}
.wr.h{font-size:10px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;border-top:0;height:18px}
.wr.t{font-weight:600;border-top:1px solid var(--muted)}
.wr .z{color:var(--faint)}
.wr .sh{color:var(--muted);font-size:11.5px}
/* cash page */
.cash{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:10px;padding:10px 14px;align-items:start}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.kpi span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi b{display:block;font:500 20px/1.2 "Newsreader",Georgia,serif}
.kpi small{color:var(--muted);font-size:11.5px}
.cb{border:1px solid var(--line);border-radius:12px;padding:10px 12px 6px}
.cb h3{margin:0 0 6px;font:500 17px/1.1 "Newsreader",Georgia,serif;display:flex;justify-content:space-between;align-items:baseline}
.cb h3 em{font:400 11.5px "IBM Plex Sans",sans-serif;color:var(--muted);font-style:normal}
.cr{display:grid;gap:0 8px;align-items:center;font-size:12.5px;min-height:24px;border-top:1px solid var(--line)}
.cr.h{font-size:10px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;border-top:0;min-height:18px}
.cr span:not(:first-child){text-align:right}
.cr .n{text-align:left!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr .n small{color:var(--faint);margin-left:5px;font-size:11px}
.acc .cr{grid-template-columns:minmax(0,1fr) 50px 80px 118px;min-height:25px}
.acc .cr small{color:var(--faint);font-size:11px;margin-left:4px}
.acc .cr.g{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-height:22px;border-top:1px solid var(--line);background:var(--soft);margin:0 -12px;padding:0 12px}
.acc .cr.g span:nth-child(3){font-size:12px;letter-spacing:0;color:var(--ink)}
.od{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;position:relative;top:-1px}
.cb h3 em .od{margin:0 4px 0 8px}
.red .cr{grid-template-columns:76px minmax(0,1fr) 76px 64px}
.best .cr{grid-template-columns:minmax(0,1fr) 50px}
.best .cat{font-size:10px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:0 0 1px;border-top:1px solid var(--line)}
.best .cat:first-of-type{border-top:0;padding-top:0}
.best .cr{border-top:0;min-height:19px;grid-template-columns:minmax(0,1fr) 44px}
.best .cr .n small{margin-left:6px;font-size:10.5px}
.soon{color:var(--loss);font-weight:600}
.gap{font-size:11.5px}
.ccol{display:flex;flex-direction:column;gap:10px}
.rec .rh{font-size:10px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 2px}
.rec .rh+.rr{border-top:0}
.rr{padding:5px 0;border-top:1px solid var(--line);font-size:12.5px;line-height:1.35}
.rr .rk{font-weight:600}
.rr .tg{margin-right:6px;position:relative;top:-1px}
.rr .rk small{font-weight:400;color:var(--muted);font-size:11.5px}
.rr .ra{color:var(--ink)}
.rr .ra b{font-weight:600}
.tg{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 5px}
.tg.stay{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.tg.move{background:var(--gain-bg);color:var(--gain)}
.tg.soon{background:#FBF1DC;color:#8A6416}
.tg.keep{background:var(--gain-bg);color:var(--gain)}
.tg.wait{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){.tg.soon{background:#3A3018;color:#E2BE6E}}
.mut{color:var(--muted);font-size:11.5px}
.rule{margin:6px 0 2px;font-size:11.5px;color:var(--muted)}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px}
.bgrid .cat{border-top:0;padding-top:0}
.empty{padding:28px;max-width:520px}
.empty h2{font:500 26px "Newsreader",serif;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 16px}
.btn{border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-weight:500;background:var(--soft);margin-right:8px}
textarea{width:100%;min-height:140px;margin-top:14px;font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--soft);color:var(--ink)}
button:focus-visible{outline:2px solid var(--a2);outline-offset:2px}

@media (max-width:980px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:12px}
  .side{overflow:visible;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .side .head{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:0 18px;align-items:center}
  .side .head .eyebrow{grid-column:1/-1}
  .side .head .total{margin:6px 0 0;font-size:44px}
  .chips{grid-template-columns:repeat(4,1fr)}
  .since{grid-column:2}
  #accounts{grid-column:1;grid-row:2} #owners{grid-column:1;grid-row:3} #regions{grid-column:2;grid-row:2/4}
  .tools{grid-column:1/-1;padding-top:0}
  .card{padding:9px 12px} .mrow{padding:3px 4px}
}
@media (max-width:620px){
  .app{height:auto;min-height:100dvh;grid-template-rows:auto auto}
  .side{grid-template-columns:1fr}
  .side .head{display:block}
  .chips{grid-template-columns:1fr 1fr}
  #accounts,#owners,#regions{grid-column:auto;grid-row:auto}
  .panel{min-height:auto} .body{overflow:visible}
  .cols,.hr{grid-template-columns:20px minmax(0,1fr) 84px 64px;gap:0 8px}
  .cols>:nth-child(3),.hr>:nth-child(3),.cols>:nth-child(4),.hr>:nth-child(4),.cols>:nth-child(7),.hr>:nth-child(7){display:none}
  .ph{flex-wrap:wrap}
  /* phone: total first, holdings next, summary cards after */
  .app{display:flex;flex-direction:column;gap:12px;padding:12px}
  .side{display:contents}
  .side .head{order:1;margin:0} .panel{order:2} #accounts{order:3} #owners{order:4} #regions{order:5} .tools{order:6}
  .side .head .total{font-size:40px;margin:4px 0 8px}
  .chips{grid-template-columns:1fr 1fr}
  .ph{padding:10px 12px 8px;gap:8px 12px}
  .tabs{gap:16px;width:100%} .tabs button{font-size:20px}
  .ph .sum{flex:1 1 100%;order:3}
  .ph .sp{display:none}
  #ownerSeg{order:2;width:100%} #ownerSeg button{flex:1;min-width:0}
  .cols,.hr{padding:0 12px}
  .hr{height:auto;min-height:48px;padding-top:5px;padding-bottom:5px}
  .nm{white-space:normal;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .nm small{display:block;margin:1px 0 0}
  /* by account: one column, drop share column */
  .wrap{grid-template-columns:1fr;padding:10px}
  .wr{grid-template-columns:minmax(0,1fr) 50px 50px 58px;gap:0 6px;font-size:12px}
  .wr>:nth-child(5){display:none}
  /* cash: one column */
  .cash{grid-template-columns:1fr;padding:10px}
  .kpis{gap:6px} .kpi{padding:6px 8px} .kpi b{font-size:16px} .kpi small{font-size:10.5px}
  .acc .cr{grid-template-columns:minmax(0,1fr) 42px 66px 84px;gap:0 6px;font-size:12px}
  .bgrid{grid-template-columns:1fr!important}
  .acc .cr>:nth-child(4){line-height:1.15;padding:2px 0} .acc .cr>:nth-child(4) small{display:block;margin:0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="head">
      <div class="eyebrow"><b>Stuart &amp; Reeta</b><span id="asof">Loading prices…</span></div>
      <div class="total" id="total">–</div>
      <div>
        <div class="chips" id="chips" role="group" aria-label="Period"></div>
        <div class="since" id="since"></div>
      </div>
    </div>
    <section class="card" id="accounts"></section>
    <section class="card" id="owners"></section>
    <section class="card" id="regions"></section>
    <div class="tools">
      <button id="importBtn">Import</button><button id="pasteBtn">Paste</button><button id="exportBtn">Export</button>
      <span class="sp"></span><span id="count"></span>
      <input type="file" id="file" hidden>
    </div>
  </aside>

  <main class="panel">
    <div class="ph">
      <div class="tabs" role="group" aria-label="Page">
        <button data-page="holdings" aria-pressed="true">Holdings</button>
        <button data-page="acct" aria-pressed="false">By account</button>
        <button data-page="cash" aria-pressed="false">Cash</button>
      </div>
      <span class="sum" id="psum"></span><span id="fchip"></span>
      <span class="sp"></span>
      <div class="seg" role="group" aria-label="Owner" id="ownerSeg"></div>
    </div>
    <div class="cols" id="cols">
      <span></span><span>Holding</span><span>Acct</span><span>Weight</span>
      <button class="r" data-sort="value" aria-pressed="true">Value</button>
      <button class="r" data-sort="move" aria-pressed="false" id="moveHead">Day</button>
      <span class="r">%</span>
    </div>
    <div class="body" id="body"></div>
    <div class="note" id="note" role="status"></div>
  </main>
</div>
<script>
const KEY='portfolio.holdings.v1';
const gbp=n=>(n<0?'−':'')+'£'+Math.abs(Math.round(n)).toLocaleString('en-GB');
const gbpk=n=>{const a=Math.abs(n);const s=a>=1e6?(a/1e6).toFixed(2)+'m':a>=1e4?Math.round(a/1e3)+'k':Math.round(a).toLocaleString('en-GB');return (n<0?'−':'')+'£'+s};
const sgn=n=>(n>0?'+':n<0?'−':'');
const pct=n=>sgn(n)+Math.abs(n*100).toFixed(1)+'%';
const pct2=n=>sgn(n)+Math.abs(n*100).toFixed(2)+'%';
const share=n=>(n*100).toFixed(n<.1?1:0)+'%';
const cls=n=>Math.abs(n)<0.5?'flat':n>0?'up':'down';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ACCOUNTS=[['ISA','ISAs','var(--a1)'],['SIPP','Pensions','var(--a2)'],['GIA','Ordinary','var(--a3)'],['other','Private & tax-relief','var(--a4)']];
const PERIODS=[['day','prev'],['week','w'],['month','m'],['year','y']];
let rates=null, data=null, prices=null, owner='', account='', sort='value', period='day', page='holdings';
try{period=localStorage.getItem('portfolio.period')||'day'; page=localStorage.getItem('portfolio.page')||'holdings'}catch(e){}
if(!['holdings','acct','cash'].includes(page)) page='holdings';

function load(){try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){data=null}}
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){} data=d}
function remember(k,v){try{localStorage.setItem('portfolio.'+k,v)}catch(e){}}

function toGBP(p,field){
  const v=p[field]; if(v==null) return null;
  const fx=prices.fx||{};
  const r=s=>fx[s]?.[field]??fx[s]?.close;
  if(p.cur==='GBp') return v/100;
  if(p.cur==='GBP') return v;
  if(p.cur==='USD') return v/r('GBPUSD=X');
  if(p.cur==='EUR') return v*r('EURGBP=X');
  return null;
}
function value(h){
  const p=h.ticker&&prices?.prices?.[h.ticker];
  const out={now:h.value_29oct, live:false, base:{}};
  if(p&&h.units!=null){
    const now=toGBP(p,'close');
    if(now){out.now=h.units*now; out.live=true;
      PERIODS.forEach(([k,f])=>{const b=toGBP(p,f); out.base[k]=b?h.units*b:null;});}
  }
  return out;
}
const mv=(r,k)=>r.live&&r.base[k]!=null?r.now-r.base[k]:null;
const acct=h=>['ISA','SIPP','GIA'].includes(h.account)?h.account:'other';
const short=n=>{const m=n.match(/\(([^)]+)\)\s*$/);const base=n.replace(/\s*\([^)]*\)\s*$/,'');return {base,code:m?m[1].replace(/ price$/,''):''}};
const sum=(rs,f)=>rs.reduce((s,r)=>s+(f(r)||0),0);

function lastDate(){
  if(!prices?.prices) return null;
  const ds=Object.values(prices.prices).map(p=>p.date).filter(Boolean).sort();
  return ds.length?new Date(ds[ds.length-1]+'T12:00:00'):null;
}
function periodLabel(k){
  if(k==='week') return 'Week'; if(k==='month') return 'Month'; if(k==='year') return 'Year';
  const dt=lastDate(); if(!dt) return 'Day';
  if(dt.toDateString()===new Date().toDateString()) return 'Today';
  return dt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
}

function sizeRows(){
  const b=document.getElementById('body'), n=b.querySelectorAll('.hr').length;
  if(!n||window.innerWidth<=620){b.style.removeProperty('--rh');return}
  const h=Math.max(window.innerWidth<=980?20:22,Math.min(40,Math.floor(b.clientHeight/n)));
  b.style.setProperty('--rh',h+'px');
}

function render(){
  const body=document.getElementById('body');
  document.querySelectorAll('[data-page]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.page===page));
  if(!data){
    document.getElementById('total').textContent='–';
    ['chips','since','accounts','owners','regions','psum','fchip','count','ownerSeg'].forEach(id=>document.getElementById(id).innerHTML='');
    ['accounts','owners','regions','cols'].forEach(id=>document.getElementById(id).style.display='none');
    body.innerHTML=`<div class="empty"><h2>No holdings yet</h2><p>Your holdings are kept only on this device, never on the website. Paste or import the holdings file Claude gave you.</p><button class="btn" onclick="pasteHoldings()">Paste holdings</button><button class="btn" onclick="document.getElementById('file').click()">Import file</button></div>`;
    return;
  }
  ['accounts','owners','regions'].forEach(id=>document.getElementById(id).style.display='');
  const rows=data.holdings.map(h=>({...h,...value(h)}));
  const tot=sum(rows,r=>r.now), base29=sum(rows,r=>r.value_29oct);

  document.getElementById('total').textContent=gbp(tot);
  document.getElementById('chips').innerHTML=PERIODS.map(([k])=>{
    const m=sum(rows,r=>mv(r,k)), b=sum(rows.filter(r=>mv(r,k)!=null),r=>r.base[k]);
    return `<button class="chip" data-period="${k}" aria-pressed="${period===k}"><span>${esc(periodLabel(k))}</span>${b?`<b class="${cls(m)}">${gbp(m)} <i>${pct(m/b)}</i></b>`:'<b class="flat">waiting for data</b>'}</button>`;}).join('');
  document.querySelectorAll('[data-period]').forEach(el=>el.onclick=()=>{period=el.dataset.period;remember('period',period);render()});
  const since=new Date(data.baseline).toLocaleDateString('en-GB',{day:'numeric',month:'short'}), sb=tot-base29;
  document.getElementById('since').innerHTML=`Since ${since} <b class="${cls(sb)}">${gbp(sb)} (${pct(sb/base29)})</b>`;

  const byA=ACCOUNTS.map(([k,l,c])=>({k,l,c,v:sum(rows.filter(r=>acct(r)===k),r=>r.now)})).filter(x=>x.v>0);
  document.getElementById('accounts').innerHTML=`<h2>Where it sits <em>tap to filter</em></h2>
    <div class="stack">${byA.map(x=>`<span style="width:${x.v/tot*100}%;background:${x.c}"></span>`).join('')}</div>`+
    byA.map(x=>`<button class="mrow" data-acct="${x.k}" aria-pressed="${account===x.k}"><span class="dot" style="background:${x.c}"></span><span class="l">${x.l}</span><span class="v">${gbp(x.v)}</span><span class="p">${share(x.v/tot)}</span></button>`).join('');
  document.querySelectorAll('[data-acct]').forEach(el=>el.onclick=()=>{account=account===el.dataset.acct?'':el.dataset.acct;page='holdings';render()});

  const byO=['Stuart','Reeta'].map(o=>({o,v:sum(rows.filter(r=>r.owner===o),r=>r.now)}));
  document.getElementById('owners').innerHTML=`<h2>Who owns it</h2>
    <div class="stack">${byO.map(x=>`<span style="width:${x.v/tot*100}%;background:var(--${x.o.toLowerCase()})"></span>`).join('')}</div>`+
    byO.map(x=>`<div class="mrow"><span class="dot" style="background:var(--${x.o.toLowerCase()});border-radius:50%"></span><span class="l">${x.o}</span><span class="v">${gbp(x.v)}</span><span class="p">${share(x.v/tot)}</span></div>`).join('');

  const listed=rows.filter(r=>r.region&&r.region!=='Alternatives'&&r.ticker);
  const lt=sum(listed,r=>r.now); const regs={};
  listed.forEach(r=>regs[r.region]=(regs[r.region]||0)+r.now);
  const rl=Object.entries(regs).sort((a,b)=>b[1]-a[1]); const mx=rl[0]?.[1]||1;
  document.getElementById('regions').innerHTML=`<h2>Shares by region <em>${gbpk(lt)}</em></h2>`+
    rl.map(([k,v])=>`<div class="reg"><span>${esc(k.replace('Emerging Markets','Emerging mkts'))}</span><span class="track"><span style="width:${v/mx*100}%"></span></span><span class="p">${share(v/lt)}</span></div>`).join('');

  // owner buttons with totals
  document.getElementById('ownerSeg').innerHTML=[['','All'],['Stuart','Stuart'],['Reeta','Reeta']].map(([k,l])=>
    `<button data-owner="${k}" aria-pressed="${owner===k}"><b>${l}</b><small>${gbpk(sum(rows.filter(r=>!k||r.owner===k),r=>r.now))}</small></button>`).join('');
  document.querySelectorAll('[data-owner]').forEach(b=>b.onclick=()=>{owner=b.dataset.owner;render()});

  document.getElementById('count').textContent=`${rows.length} holdings`;
  document.getElementById('ownerSeg').style.display=page==='holdings'?'':'none';
  if(page==='acct'){renderWrappers(rows);return}
  if(page==='cash'){renderCash();return}

  document.getElementById('cols').style.display='';
  const view=rows.filter(r=>(!owner||r.owner===owner)&&(!account||acct(r)===account));
  const vm=sum(view,r=>mv(r,period));
  view.sort(sort==='move'?(a,b)=>(mv(a,period)??0)-(mv(b,period)??0):(a,b)=>b.now-a.now);
  const maxw=Math.max(...view.map(r=>r.now/tot),1e-9);
  document.getElementById('moveHead').textContent=periodLabel(period);
  document.getElementById('psum').innerHTML=`${view.length} · ${periodLabel(period).toLowerCase()} <span class="${cls(vm)}">${gbp(vm)}</span>`;
  const al=ACCOUNTS.find(a=>a[0]===account);
  document.getElementById('fchip').innerHTML=al?`<span class="filter">${al[1]}<button aria-label="Clear filter" onclick="account='';render()">×</button></span>`:'';
  body.innerHTML=view.map(r=>{
    const s=short(r.name), m=mv(r,period), p=m!=null&&r.base[period]?m/r.base[period]:null;
    return `<div class="hr"><span class="own ${r.owner}" title="${r.owner}">${r.owner[0]}</span>
      <span class="nm">${esc(s.base)}${s.code?`<small>${esc(s.code)}</small>`:''}</span>
      <span class="tag">${esc(r.account==='Direct LP'?'LP':r.account)}</span>
      <span class="w"><span class="t"><span style="width:${r.now/tot/maxw*100}%"></span></span><em>${share(r.now/tot)}</em></span>
      <span class="r val">${gbp(r.now)}</span>
      <span class="r ${m==null?'flat':cls(m)}">${m==null?(r.live?'–':'fixed'):gbp(m)}</span>
      <span class="pill ${p==null?'flat':cls(m)}">${p==null?'–':pct2(p)}</span></div>`;}).join('');
  const stale=rows.filter(r=>r.ticker&&!r.live).map(r=>short(r.name).code||r.name);
  const n=document.getElementById('note');
  if(!n.dataset.hold) n.textContent=stale.length?`No price for ${stale.join(', ')}; shown at ${since} value.`:'';
  requestAnimationFrame(sizeRows);
}

function renderCash(){
  document.getElementById('note').textContent='';
  document.getElementById('cols').style.display='none'; document.getElementById('fchip').innerHTML='';
  document.getElementById('psum').textContent='Savings and what to do';
  const C=(data.cash||[]).filter(c=>c.type!=='current'); const body=document.getElementById('body');
  if(!C.length){body.innerHTML='<div class="empty"><h2>No cash recorded</h2><p>Paste the latest holdings file from Claude; it carries the cash accounts.</p></div>';return}
  const today=new Date(); today.setHours(0,0,0,0);
  const dd=s=>s?Math.round((new Date(s+'T00:00:00')-today)/864e5):null;
  const fmtD=s=>new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'});
  const pc=r=>(r*100).toFixed(2)+'%';
  const tot=sum(C,c=>c.balance), inst=sum(C.filter(c=>!c.free),c=>c.balance), lock=tot-inst;
  const intr=sum(C,c=>c.balance*(c.rate||0)), wr=intr/tot;
  const R=rates?.categories||{}, bi=R.instant?.[0], b1=R['1y']?.[0];
  const SWITCH_MIN=250, tr=o=>o==='Stuart'?(data.settings?.stuart_tax_rate??0.45):(data.settings?.reeta_tax_rate??0.20);
  const kpi=(l,v,s)=>`<div class="kpi"><span>${l}</span><b>${v}</b><small>${s}</small></div>`;

  // one table: available now, then locked by date
  const shown=C.filter(c=>c.balance>=1000);
  const now=shown.filter(c=>!c.free).sort((a,b)=>b.balance-a.balance), later=shown.filter(c=>c.free).sort((a,b)=>a.free.localeCompare(b.free));
  const row=c=>{const d=dd(c.free); const soon=c.free&&d<=45;
    const av=!c.free?'<span class="z">now</span>':`<span class="${soon?'soon':''}">${fmtD(c.free)} <small>${d<0?'due':d<=60?d+' days':Math.round(d/30.4)+' mths'}</small></span>`;
    return `<div class="cr"><span class="n"><i class="od" style="background:var(--${c.owner.toLowerCase()})"></i>${esc(c.name.replace('Cahoot Sunny Day Saver','Sunny Day Saver').replace('Marcus 1-year fixed','Marcus fixed'))}</span><span>${c.rate!=null?pc(c.rate):'?'}</span><span><b>${gbp(c.balance)}</b></span>${av}</div>`};
  const sub=(l,f)=>`<div class="cr g"><span>${l}</span><span></span><span>${gbp(sum(C.filter(f),c=>c.balance))}</span><span></span></div>`;
  const accRows=sub('Available now',c=>!c.free)+now.map(row).join('')+sub('Locked',c=>!!c.free)+later.map(row).join('');
  const best=[['instant','Instant'],['1y','1-year fixed'],['2y','2-year fixed']].map(([k,l])=>`<div class="bc"><div class="cat">${l}</div>`+(R[k]||[]).slice(0,2).map(x=>`<div class="cr" title="${esc(x.note||'')}"><span class="n">${esc(x.provider)}</span><span><b>${pc(x.rate)}</b></span></div>`).join('')+'</div>').join('');

  // recommendations
  const net=(r,o)=>r*(1-tr(o));
  const nm=[];
  if(bi) nm.push(`<div class="rr">Needed within a year → <b>${esc(bi.provider)}</b> ${pc(bi.rate)} <small class="mut">(${pc(net(bi.rate,'Reeta'))} after tax)</small></div>`);
  if(b1) nm.push(`<div class="rr">Not needed for a year → <b>${esc(b1.provider)} 1-year fix</b> ${pc(b1.rate)} <small class="mut">(${pc(net(b1.rate,'Reeta'))} after tax)</small></div>`);
  const ex=[]; const L=C.filter(c=>c.balance>2000&&c.type!=='current').sort((a,b)=>b.balance-a.balance);
  const item=(tag,title,act)=>`<div class="rr"><div class="rk"><span class="tg ${tag}">${{stay:'Stay',move:'Move',soon:'Soon',keep:'Keep',wait:'Wait'}[tag]}</span>${title}</div><div class="ra">${act}</div></div>`;
  const okStay=[];
  L.filter(c=>c.type==='instant').forEach(c=>{const g=bi?(bi.rate-c.rate)*c.balance*(1-tr(c.owner)):0;
    if(g>=SWITCH_MIN) ex.push(item('move',`${esc(c.name)} <small>${gbpk(c.balance)} at ${pc(c.rate)}</small>`,`Move to <b>${esc(bi.provider)}</b> ${pc(bi.rate)}: +${gbp(g)} a year after tax.`));
    else if(g>0) ex.push(item('stay',`${esc(c.name)} <small>${gbpk(c.balance)} at ${pc(c.rate)}</small>`,`Switching to the best rate gains only ${gbp(g)} a year after tax.`));
    else okStay.push(esc(c.name.replace('Cahoot Sunny Day Saver','Sunny Day Saver')));});
  if(okStay.length) ex.push(item('stay',okStay.join(', '),'Already above the best instant rate.'));
  L.filter(c=>c.type==='fixed'&&dd(c.free)<=120&&b1).forEach(c=>{const g=b1&&bi?(b1.rate-bi.rate)*c.balance*(1-tr(c.owner)):0;
    ex.push(item('soon',`${esc(c.name)} <small>${gbpk(c.balance)} frees ${fmtD(c.free)}</small>`,`Fix what isn't needed for a year at <b>${esc(b1.provider)}</b> (up to +${gbp(g)} a year after tax); the rest to instant.`));});
  const lk=L.filter(c=>c.type==='fixed'&&dd(c.free)>120);
  if(lk.length) ex.push(item('wait',lk.map(c=>esc(c.name.replace('Marcus 1-year fixed','Marcus fixed'))).join(', '),'Locked. Nothing to do until they mature.'));
  const rl=L.filter(c=>c.type==='relief');
  if(rl.length) ex.push(item('keep',`Charity Bank <small>${gbpk(sum(rl,c=>c.balance))}, Stuart</small>`,'5% a year off income tax beats any savings rate.'));
  body.innerHTML=`<div class="cash">
    <div class="kpis">${kpi('Savings',gbp(tot),`${C.length} accounts`)}${kpi('Available now',gbp(inst),share(inst/tot)+' of savings')}${kpi('Interest a year',gbp(intr),'average '+pc(wr))}</div>
    <div class="ccol">
      <section class="cb acc"><h3>Accounts <em><i class="od" style="background:var(--reeta)"></i>Reeta <i class="od" style="background:var(--stuart)"></i>Stuart</em></h3>
        <div class="cr h"><span>Account</span><span>Rate</span><span>Balance</span><span>Available</span></div>${accRows}</section>
      <section class="cb best"><h3>Best rates <em>FSCS banks only · ${rates?.asof?fmtD(rates.asof):'–'}${rates?.asof&&dd(rates.asof)<-45?' · out of date':''}</em></h3><div class="bgrid">${best}</div></section>
    </div>
    <div class="ccol">
      <section class="cb rec"><h3>What to do</h3>
        <div class="rh">New money</div>${nm.join('')}
        <div class="rh">Accounts over £2,000</div>${ex.join('')}
        <p class="rule">Switch only for £${SWITCH_MIN}+ a year after tax. Reeta: 20% tax on interest over £1,000.</p>
      </section>

    </div></div>`;
  document.getElementById('note').textContent='';
}
function renderWrappers(rows){
  document.getElementById('cols').style.display='none'; document.getElementById('fchip').innerHTML='';
  document.getElementById('psum').textContent='Stuart and Reeta by value and share';
  const G=[['SIPP','Pensions'],['ISA','ISAs'],['GIA','Ordinary accounts'],['other','Private & tax-relief']];
  const cell=v=>v>0.5?`<span>${gbpk(v)}</span>`:`<span class="z">–</span>`;
  const tidy=n=>n.replace(/^(Vanguard|Xtrackers|iShares Core|iShares)\s+/,'').replace(/ Index Unit Trust/,'').replace(/^FTSE Dev /,'Dev ').replace(/ holdings$/,'');
  const all=sum(rows,r=>r.now);
  const sec=([k,label])=>{
    const rs=rows.filter(r=>acct(r)===k); if(!rs.length) return '';
    const agg={};
    rs.forEach(r=>{const key=r.ticker||r.name;const a=agg[key]??={name:r.name,S:0,R:0};a[r.owner==='Reeta'?'R':'S']+=r.now;});
    const list=Object.values(agg).map(a=>({...a,T:a.S+a.R})).sort((a,b)=>b.T-a.T);
    const S=sum(list,a=>a.S), R=sum(list,a=>a.R), T=S+R;
    return `<section class="wb"><header><h3>${label}</h3><b>${gbp(T)}</b></header>
      <div class="split"><span style="width:${S/T*100}%;background:var(--stuart)"></span><span style="width:${R/T*100}%;background:var(--reeta)"></span></div>
      <div class="wsum"><span><i style="background:var(--stuart)"></i>Stuart <b>${gbp(S)}</b> · ${share(S/T)}</span><span><i style="background:var(--reeta)"></i>Reeta <b>${gbp(R)}</b> · ${share(R/T)}</span></div>
      <div class="wr h"><span>Holding</span><span>Stuart</span><span>Reeta</span><span>Total</span><span>Share</span></div>
      ${list.map(a=>{const sh=short(a.name);return `<div class="wr"><span class="n">${esc(tidy(sh.base))}${sh.code?`<small>${esc(sh.code)}</small>`:''}</span>${cell(a.S)}${cell(a.R)}<span><b>${gbpk(a.T)}</b></span><span class="sh">${share(a.T/T)}</span></div>`}).join('')}
      <div class="wr t"><span>Total</span>${cell(S)}${cell(R)}<span>${gbpk(T)}</span><span class="sh">${share(T/all)}</span></div>
    </section>`;};
  document.getElementById('body').innerHTML=`<div class="wrap"><div class="wcol">${sec(G[0])}${sec(G[3])}</div><div class="wcol">${sec(G[1])}${sec(G[2])}</div></div>`;
  document.getElementById('note').textContent='Share column: each holding as a share of that account type. Total row: the account type as a share of everything.';
}
document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{
  sort=b.dataset.sort; document.querySelectorAll('[data-sort]').forEach(x=>x.setAttribute('aria-pressed',x===b)); render();});
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;remember('page',page);render()});
window.addEventListener('resize',sizeRows);

function note(msg,err){const n=document.getElementById('note');n.textContent=msg;n.classList.toggle('err',!!err);n.dataset.hold='1';
  setTimeout(()=>{n.classList.remove('err');delete n.dataset.hold;render()},4000)}
function parseHoldings(t){
  t=String(t||'');
  if(/&quot;|<\w/.test(t)){const doc=new DOMParser().parseFromString(t,'text/html'); t=doc.body?doc.body.textContent:t;}
  const a=t.indexOf('{'), b=t.lastIndexOf('}'); if(a<0||b<=a) throw 0;
  const d=JSON.parse(t.slice(a,b+1)); if(!Array.isArray(d.holdings)) throw 0; return d;}
function useHoldings(t){
  try{const d=parseHoldings(t); save(d); render(); note(`Imported ${d.holdings.length} holdings.`);}
  catch{note('That is not a holdings file. Use the holdings.json Claude produced.',true);}}
async function pasteHoldings(){
  try{const t=await navigator.clipboard.readText(); if(t&&t.includes('holdings')) return useHoldings(t);}catch{}
  page='holdings'; render();
  let box=document.getElementById('pasteBox');
  if(!box){box=document.createElement('textarea');box.id='pasteBox';box.placeholder='Press and hold here, then tap Paste';
    (document.querySelector('.empty')||document.getElementById('body')).prepend(box);}
  box.focus(); box.oninput=()=>{if(box.value.trim().endsWith('}')) useHoldings(box.value);};}
document.getElementById('pasteBtn').onclick=pasteHoldings;
document.getElementById('importBtn').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=async e=>{const f=e.target.files[0]; if(!f) return; useHoldings(await f.text()); e.target.value='';};
document.getElementById('exportBtn').onclick=()=>{
  if(!data) return; const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'})); a.download='holdings.json'; a.click();};

(async()=>{
  load();
  try{rates=await (await fetch('rates.json?'+Date.now(),{cache:'no-store'})).json();}catch{}
  try{prices=await (await fetch('prices.json?'+Date.now(),{cache:'no-store'})).json();
    const u=new Date(String(prices.updated).replace(' UTC','Z').replace(' ','T'));
    document.getElementById('asof').textContent='Prices '+(isNaN(u)?prices.updated:u.toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}));}
  catch{document.getElementById('asof').textContent='Prices unavailable'; note('Prices could not be loaded. Values shown at baseline.',true);}
  render();
})();
</script>
